server:
  port: 9999
  servlet:
    context-path: /api

spring:
  application:
    name: saas
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:saas_barbershop;DB_CLOSE_DELAY=-1
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema-h2.sql

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.barbershop.saas.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

jwt:
  secret: barbershop-saas-2024-secret-key-jwt-token
  expiration: 86400000

logging:
  level:
    com.barbershop.saas: debug
